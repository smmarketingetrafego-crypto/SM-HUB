<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CC" />
      <stop offset="35%" stop-color="#DFBA47" />
      <stop offset="70%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151518" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#C9A227" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Gold SM Monogram -->
  <g filter="url(#goldGlow)">
    <!-- "SM" Stylized Text -->
    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" 
          font-family="Outfit, system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="200" 
          letter-spacing="-12" 
          fill="url(#goldGradient)">
      SM
    </text>
    <!-- HUB Accent Subtitle -->
    <text x="50%" y="78%" text-anchor="middle" dominant-baseline="central" 
          font-family="Outfit, system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="44" 
          letter-spacing="16" 
          fill="#DFBA47">
      HUB
    </text>
  </g>
</svg>
